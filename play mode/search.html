<!DOCTYPE html>
<html lang="en-NG">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results | Play Mode Africa</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="about.css"> <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* ================================================================= */
        /* SEARCH ARCHITECTURE GRAPHICS LAYOUT ENGINE                        */
        /* ================================================================= */
        .search-container { 
            padding: 60px 0; 
            min-height: 70vh; 
        }
        .search-query-header { 
            font-size: 2.2rem; 
            font-weight: 800; 
            margin-bottom: 8px; 
        }
        .search-meta { 
            color: var(--text-grey); 
            margin-bottom: 40px; 
            font-size: 0.95rem; 
        }
        .results-section-title { 
            font-size: 1.4rem; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            margin: 40px 0 20px; 
            padding-bottom: 10px; 
            border-bottom: 2px solid var(--border); 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        
        /* ================================================================= */
        /* LIVE LOADING & SPINNER MECHANICS                                  */
        /* ================================================================= */
        .loading-state { 
            text-align: center; 
            padding: 60px 0; 
            display: none; 
        }
        .loading-spinner { 
            border: 3px solid rgba(211,30,36,0.1); 
            border-radius: 50%; 
            border-top: 3px solid var(--primary-red); 
            width: 40px; 
            height: 40px; 
            animation: spin 1s linear infinite; 
            margin: 0 auto 20px; 
        }
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
        
        /* ================================================================= */
        /* EXCEPTION ERROR CARD INTERFACE                                    */
        /* ================================================================= */
        .error-message { 
            background: rgba(211,30,36,0.1); 
            border: 1px solid rgba(211,30,36,0.2); 
            border-radius: 8px; 
            padding: 20px; 
            color: #ff4d4d; 
            text-align: center; 
            margin: 20px 0; 
            display: none; 
        }
        
        /* ================================================================= */
        /* MODAL COLOR GRAPHICS FALLBACKS AND HELPERS                       */
        /* ================================================================= */
        .text-red {
            color: var(--primary-red);
        }
        .btn-red {
            background: var(--primary-red);
            color: var(--text-white);
            border: none;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
        }
        .btn-red:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .btn-outline {
            background: transparent;
            color: var(--text-white);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--text-white);
            transform: translateY(-2px);
        }

        /* ===== CUSTOM TOP SEARCH BAR OVERLAY ===== */
        .custom-search-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0D0D0D;
            display: flex;
            align-items: center;
            justify-content: space-between;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
            z-index: 1001;
            padding: 0 20px;
        }
        .custom-search-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .custom-search-form {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            background: rgba(255,255,255,0.07);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 5px 15px;
            transition: var(--transition);
        }
        .custom-search-form:focus-within {
            border-color: var(--primary-red);
            background: rgba(255,255,255,0.1);
        }
        .custom-search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-white);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            padding: 6px 10px;
        }
        .custom-search-input::placeholder {
            color: var(--text-grey);
        }
        .custom-search-submit {
            background: transparent;
            border: none;
            color: var(--text-grey);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .custom-search-submit:hover {
            color: var(--primary-red);
        }
        .custom-search-close {
            background: transparent;
            border: none;
            color: var(--text-grey);
            cursor: pointer;
            font-size: 1.2rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            margin-left: 15px;
        }
        .custom-search-close:hover {
            color: var(--primary-red);
        }
    </style>
</head>
<body>

    <header>
        <nav class="container">
            <div class="logo">
                <a href="index.html" class="logo-anim-wrap">
                    <img src="assets/play-mode-logo.png" class="logo-frame logo-frame-0 active" alt="Play Mode Africa">
                </a>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
            </ul>
            <div class="nav-actions">
                <i data-lucide="search" class="search-icon" id="headerSearchIcon"></i>
                <a href="https://youtube.com/@playmodeafrica" target="_blank" rel="noopener" class="btn-primary">Subscribe</a>
                <div class="hamburger" id="hamburger">
                    <span></span><span></span><span></span>
                </div>
            </div>

            <!-- CUSTOM SEARCH OVERLAY BAR -->
            <div class="custom-search-overlay" id="customSearchOverlay">
                <form class="custom-search-form" id="customSearchForm">
                    <input type="text" class="custom-search-input" id="customSearchInput" placeholder="Search Play Mode Africa (News, Entertainment, Videos)..." autocomplete="off">
                    <button type="submit" class="custom-search-submit">
                        <i data-lucide="search"></i>
                    </button>
                </form>
                <button class="custom-search-close" id="customSearchClose">
                    <i data-lucide="x"></i>
                </button>
            </div>
        </nav>
    </header>

    <main class="container search-container">
        <h1 class="search-query-header">Search Results</h1>
        <p class="search-meta" id="searchMetaInfo">Initializing discovery cross-match network...</p>

        <div class="loading-state" id="searchLoadingState">
            <div class="loading-spinner"></div>
            <p style="color: var(--text-grey)">Fetching verified content streams from YouTube & global news grids...</p>
        </div>

        <div class="error-message" id="searchErrorDisplay"></div>

        <div id="videoResultsWrapper">
            <h2 class="results-section-title"><i class="fa-solid fa-video text-red"></i> Video Coverage (Max 2)</h2>
            <div class="coverage-grid" id="videoResultsGrid"></div>
        </div>

        <div id="articleResultsWrapper">
            <h2 class="results-section-title"><i class="fa-solid fa-newspaper text-red"></i> News Briefings (Max 3)</h2>
            <div class="coverage-grid" id="articleResultsGrid"></div>
        </div>
    </main>

    <footer>
        <div class="container footer-bottom">
            <p>&copy; 2026 Play Mode Africa. Powered by Stream Guys Media engine.</p>
        </div>
    </footer>

    <script src="search.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
